<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페어틀 메이커 (Pair Frame Maker)</title>
  <!-- 이미지 저장 라이브러리 (html2canvas) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
    }

    body {
      background-color: #f0f2f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }

    /* 컨트롤 버튼 영역 */
    .controls {
      margin-bottom: 20px;
    }

    .btn-save {
      background-color: #2b2b2b;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .btn-save:hover {
      background-color: #4a4a4a;
    }

    /* 틀 전체 프레임 Canvas */
    #frame-canvas {
      width: 1200px;
      height: 580px;
      background-color: #ffffff;
      padding: 24px;
      display: grid;
      grid-template-columns: 310px 1fr 310px;
      gap: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      position: relative;
    }

    /* 이미지 업로드 공통 슬롯 */
    .img-slot {
      background-color: #f7f7f9;
      border: 1px dashed #cccccc;
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s ease;
    }

    .img-slot:hover {
      border-color: #888888;
    }

    .img-slot input[type="file"] {
      display: none;
    }

    .img-slot img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .img-slot .placeholder-text {
      color: #888888;
      font-size: 13px;
      pointer-events: none;
      text-align: center;
      padding: 4px;
    }

    /* 이미지가 첨부되었을 때 표시 */
    .img-slot.has-image img {
      display: block;
    }
    .img-slot.has-image .placeholder-text {
      display: none;
    }

    /* 좌/우 캐릭터 컬럼 공통 */
    .char-column {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-duo {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      height: 130px;
    }

    .mid-duo {
      display: flex;
      gap: 10px;
      height: 250px;
    }

    .ld-slot {
      flex: 1.2;
    }

    .animal-slot {
      flex: 0.8;
      height: 120px;
    }

    .text-area-box {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .text-area-box input {
      border: none;
      outline: none;
      font-family: 'Georgia', cursive, sans-serif;
      font-size: 20px;
      font-style: italic;
      color: #bf4343;
      background: transparent;
    }

    .text-area-box textarea {
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      font-size: 12px;
      line-height: 1.6;
      color: #333333;
      width: 100%;
      height: 100%;
    }

    /* 중앙 컬럼 (메인 일러스트) */
    .center-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .main-illust-top {
      flex: 1;
    }

    .main-illust-bottom {
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn-save" onclick="saveAsImage()">📷 이미지로 저장하기</button>
  </div>

  <!-- 페어틀 메인 캔버스 -->
  <div id="frame-canvas">

    <!-- 좌측 캐릭터 (Character A) -->
    <div class="char-column">
      <!-- 상단: 두상 A / SD 전신 A -->
      <div class="top-duo">
        <label class="img-slot">
          <span class="placeholder-text">두상 A</span>
          <input type="file" accept="image/*" onchange="loadImage(event, this)">
          <img src="" alt="두상 A">
        </label>
        <label class="img-slot">
          <span class="placeholder-text">SD 전신 A</span>
          <input type="file" accept="image/*" onchange="loadImage(event, this)">
          <img src="" alt="SD 전신 A">
        </label>
      </div>

      <!-- 중단: LD 전신 A + 동물화 A -->
      <div class="mid-duo">
        <label class="img-slot ld-slot">
          <span class="placeholder-text">LD 전신 A</span>
          <input type="file" accept="image/*" onchange="loadImage(event, this)">
          <img src="" alt="LD 전신 A">
        </label>
        <div style="display: flex; flex-direction: column; flex: 0.8; gap: 10px;">
          <label class="img-slot animal-slot">
            <span class="placeholder-text">동물화 A</span>
            <input type="file" accept="image/*" onchange="loadImage(event, this)">
            <img src="" alt="동물화 A">
          </label>
          <!-- 캐릭터 A 로고/설명 -->
          <div class="text-area-box">
            <input type="text" value="Monet" placeholder="이름/서명 입력">
            <textarea placeholder="캐릭터 설명을 입력하세요...">마도학자 예술품, 20세기 말 전시...</textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- 중앙 메인 일러스트 2개 -->
    <div class="center-column">
      <label class="img-slot main-illust-top">
        <span class="placeholder-text">메인 일러스트 1 (16:9 추천)</span>
        <input type="file" accept="image/*" onchange="loadImage(event, this)">
        <img src="" alt="메인 일러스트 1">
      </label>
      <label class="img-slot main-illust-bottom">
        <span class="placeholder-text">메인 일러스트 2 / 음반 커버</span>
        <input type="file" accept="image/*" onchange="loadImage(event, this)">
        <img src="" alt="메인 일러스트 2">
      </label>
    </div>

    <!-- 우측 캐릭터 (Character B) -->
    <div class="char-column">
      <!-- 상단: SD 전신 B / 두상 B -->
      <div class="top-duo">
        <label class="img-slot">
          <span class="placeholder-text">SD 전신 B</span>
          <input type="file" accept="image/*" onchange="loadImage(event, this)">
          <img src="" alt="SD 전신 B">
        </label>
        <label class="img-slot">
          <span class="placeholder-text">두상 B</span>
          <input type="file" accept="image/*" onchange="loadImage(event, this)">
          <img src="" alt="두상 B">
        </label>
      </div>

      <!-- 중단: 동물화 B + LD 전신 B -->
      <div class="mid-duo">
        <div style="display: flex; flex-direction: column; flex: 0.8; gap: 10px;">
          <label class="img-slot animal-slot">
            <span class="placeholder-text">동물화 B</span>
            <input type="file" accept="image/*" onchange="loadImage(event, this)">
            <img src="" alt="동물화 B">
          </label>
          <!-- 캐릭터 B 로고/설명 -->
          <div class="text-area-box" style="text-align: right;">
            <input type="text" value="Mary" placeholder="이름/서명 입력" style="text-align: right;">
            <textarea placeholder="캐릭터 설명을 입력하세요..." style="text-align: right;">마도학자 예술품으로 1930년대 전시...</textarea>
          </div>
        </div>
        <label class="img-slot ld-slot">
          <span class="placeholder-text">LD 전신 B</span>
          <input type="file" accept="image/*" onchange="loadImage(event, this)">
          <img src="" alt="LD 전신 B">
        </label>
      </div>
    </div>

  </div>

  <script>
    // 이미지 선택 시 미리보기 적용 함수
    function loadImage(event, input) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const slot = input.closest('.img-slot');
          const img = slot.querySelector('img');
          img.src = e.target.result;
          slot.classList.add('has-image');
        };
        reader.readAsDataURL(file);
      }
    }

    // 캔버스 영역을 PNG 이미지 파일로 변환하여 다운로드
    function saveAsImage() {
      const canvasArea = document.getElementById('frame-canvas');

      html2canvas(canvasArea, {
        scale: 2, // 고화질 출력을 위해 scale 2 적용
        useCORS: true,
        backgroundColor: '#ffffff'
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = 'pair_frame.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
